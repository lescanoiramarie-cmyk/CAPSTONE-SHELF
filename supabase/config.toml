project_id = "shelf-ilms-local"
[functions.send-visitor-otp]
enabled = true
verify_jwt = false
import_map = "./functions/send-visitor-otp/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-visitor-otp/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-visitor-otp/*.html" ]

[functions.visitor-qr-login]
enabled = true
verify_jwt = false
import_map = "./functions/visitor-qr-login/deno.json"
entrypoint = "./functions/visitor-qr-login/index.ts"

[functions.manage-staff]
enabled = true
verify_jwt = true
import_map = "./functions/manage-staff/deno.json"
entrypoint = "./functions/manage-staff/index.ts"

[functions.send-due-date-notifications]
enabled = true
verify_jwt = false
import_map = "./functions/send-due-date-notifications/deno.json"
entrypoint = "./functions/send-due-date-notifications/index.ts"

[functions.send-fine-reminder]
enabled = true
verify_jwt = false
import_map = "./functions/send-fine-reminder/deno.json"
entrypoint = "./functions/send-fine-reminder/index.ts"

[functions.request-password-reset]
enabled = true
# Called from the unauthenticated login screen, so there is no JWT yet. The
# function authorizes itself with the service role key and never returns it.
verify_jwt = false
import_map = "./functions/request-password-reset/deno.json"
entrypoint = "./functions/request-password-reset/index.ts"

[functions.login-with-lockout]
enabled = true
verify_jwt = false
import_map = "./functions/login-with-lockout/deno.json"
entrypoint = "./functions/login-with-lockout/index.ts"
[db.migrations]
schema_paths = [
  "schemas",
]
[auth]
site_url = "https://shelf-system.vercel.app"
additional_redirect_urls = ["http://localhost:5173/**", "https://shelf-system.vercel.app/**"]

[auth.email]
max_frequency = "1m0s"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.passkey]
enabled = true

[auth.webauthn]
rp_display_name = "SHELF Library System"
rp_id = "shelf-system.vercel.app"
rp_origins = ["https://shelf-system.vercel.app"]

[storage.vector]
enabled = false
